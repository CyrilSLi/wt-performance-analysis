<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WT Performance Analysis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1/dist/leaflet.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1/dist/MarkerCluster.Default.min.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1/dist/leaflet.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1/dist/leaflet.markercluster.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@4.13.0/build/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dagre-d3@0.6.4/dist/dagre-d3.min.js"></script>
    <script src=".cache/data.js"></script> <!-- TODO: Replace with actual data source -->
    <style>
    </style>
</head>
<body>
    <H1>WT Performance Analysis</H1>
    <button id="reset">Reset</button>
    <button id="export-svg">Export SVG</button>
    <div id="map" style="width: 100%; height: 600px;"></div>
    <svg id="dag" style="width: 100%; height: 600px;"></svg>
    <script>
        const scheduleId = 1788652800; // TODO: User-selectable schedule

        const { directions, services, stop_segs } = window.perfData.schedules[scheduleId];
        const stops = window.perfData.stops;

        const map = L.map("map", {
            fadeAnimation: false,
            markerZoomAnimation: false,
        });
        if (localStorage.getItem("mapState")) {
            const { center, zoom } = JSON.parse(localStorage.getItem("mapState"));
            map.setView(center, zoom);
        } else {
            map.fitBounds([[49.71, -97.35], [50.00, -96.95]]);
        }

        const isRetina = L.Browser.retina;
        L.tileLayer(`https://trn-maps.winnipeg.ca/day${isRetina ? "@2x" : ""}/{z}/{x}/{y}.png`, {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxNativeZoom: 19,
            maxZoom: 22,
            tileSize: isRetina ? 128 : 256,
            zoomOffset: isRetina ? 1 : 0,
            detectRetina: false,
        }).addTo(map);

        map.on("moveend", () => {
            localStorage.setItem("mapState", JSON.stringify({
                center: map.getCenter(),
                zoom: map.getZoom()
            }));
        });

        function markerClusterGroup() {
            return new L.markerClusterGroup({
                //maxClusterRadius: 50,
                maxClusterRadius: (zoom) => {
                    if (zoom >= 15) {
                        return 0; // Disable clustering at zoom level 15 and above
                    }
                    return 50;
                },
                // disableClusteringAtZoom: 15,
            });
        }

        const allStops = markerClusterGroup();
        const selectedStops = markerClusterGroup().addTo(map);
        let firstStopMarker, secondStopMarker;

        /* const WTIcon = L.icon({
            iconUrl: "data:image/png;base64,[...]",
            iconSize: [20, 20],
            shadowSize: [0, 0],
            iconAnchor: [10, 10],
            shadowAnchor: [0, 0],
            popupAnchor: [0, -10]
        }) */
        function stopMarker(stopId, fnName = null, dirs = []) {
            const [stopName, lat, lng] = stops[stopId];
            const realStopId = stopId % 100000; // Remove the duplicate stop ID prefix
            const stopDirs = new Set(), stopServs = new Set();
            dirs.forEach(dir => {
                stopDirs.add(directions[dir % directions.length]);
                stopServs.add(Math.floor(dir / directions.length));
            });
            return new L.marker([lat, lng]).bindPopup(
                `<b>${stopName}</b><br>Stop ID: <a href="https://winnipegtransit.com/stops/${realStopId}" target="_blank" rel="noopener noreferrer">${stopId}</a>` +
                (dirs.length > 0 ? `<br>Routes:<br><ul><li>${[...stopDirs].sort().join("</li><li>")}</li></ul>` : "") +
                (dirs.length > 0 ? `<br>Services:<br><ul><li>${services.filter((_, i) => stopServs.has(i)).join("</li><li>")}</li></ul>` : "") +
                (fnName ? `<br><button onclick="${fnName}('${stopId}')">Select this stop</button>` : "")
            );
        }

        const firstStopIds = new Set(Object.keys(stop_segs));
        const fromStops = Object.fromEntries(Object.entries(stops).filter(([stopId]) => firstStopIds.has(stopId)));
        const dirsPerStop = Object.fromEntries(Object.keys(fromStops).map((stopId) => [
            stopId,
            [...new Set(Object.values(stop_segs[stopId]).flatMap(Object.keys))]
        ]));
        allStops.addLayers(Object.keys(fromStops).map(stopId => stopMarker(stopId, "selectFirstStop", dirsPerStop[stopId])));

        let firstStopId, secondStopId;
        let secondStops, paths;

        function resetMap() {
            firstStopMarker?.remove();
            secondStopMarker?.remove();
            firstStopMarker = secondStopMarker = null;
            firstStopId = secondStopId = null;
            secondStops = {}, paths = {};
            selectedStops.clearLayers();
            allStops.addTo(map);
            document.getElementById("reset").style.visibility = "hidden";
            document.getElementById("export-svg").style.visibility = "hidden";
        }
        document.getElementById("reset").addEventListener("click", resetMap);
        resetMap();

        function selectFirstStop(stopId) {
            map.removeLayer(allStops);
            firstStopMarker = stopMarker(stopId).addTo(map);
            firstStopMarker._icon.style.filter = "hue-rotate(140deg)"; // Change color to red
            firstStopId = stopId;

            const stack = dirsPerStop[stopId].map(dirId => [stopId, dirId]);
            const visited = new Set(
                stack.map(([currStop, dir]) => `${currStop},${dir}`)
            );
            while (stack.length > 0) { // DFS to find all {secondStopId: [dir1, dir2, ...]} reachable from firstStopId
                const [currStop, dir] = stack.pop();
                if (!stop_segs[currStop]) {
                    continue;
                }
                for (const [nextStop, dirs] of Object.entries(stop_segs[currStop])) {
                    if (!Object.hasOwn(dirs, dir)) {
                        continue;
                    }
                    secondStops[nextStop] = (secondStops[nextStop] || new Set()).add(dir);

                    const nextKey = `${nextStop},${dir}`;
                    if (!visited.has(nextKey)) {
                        visited.add(nextKey);
                        stack.push([nextStop, dir]);
                    }
                }
            }

            Object.keys(secondStops).forEach(stopId => {
                stopMarker(stopId, "selectSecondStop", [...secondStops[stopId]]).addTo(selectedStops);
            });

            document.getElementById("reset").style.visibility = "visible";
        }

        function selectSecondStop(stopId) {
            selectedStops.clearLayers();
            secondStopMarker = stopMarker(stopId).addTo(map);
            secondStopMarker._icon.style.filter = "hue-rotate(270deg)"; // Change color to green
            secondStopId = stopId;

            for (const dir of secondStops[stopId]) { // DFS to find all {dir: [[stop1, stop2], ...]} segments from firstStopId to secondStopId
                const canReachSecondStop = new Set([secondStopId]);
                const stack = [secondStopId];
                const reverseAdjacency = {};

                for (const [from, tos] of Object.entries(stop_segs)) {
                    for (const [to, dirs] of Object.entries(tos)) {
                        if (Object.hasOwn(dirs, dir)) {
                            reverseAdjacency[to] = (reverseAdjacency[to] || new Set()).add(from);
                        }
                    }
                }

                while (stack.length > 0) {
                    const currStop = stack.pop();

                    for (const prevStop of reverseAdjacency[currStop] || []) {
                        if (!canReachSecondStop.has(prevStop)) {
                            canReachSecondStop.add(prevStop);
                            stack.push(prevStop);
                        }
                    }
                }

                const segments = [];
                for (const from of [firstStopId, ...Object.keys(secondStops)]) { // secondStops doesn't include firstStopId so add it manually
                    if (from !== firstStopId && !secondStops[from].has(dir)) {
                        continue;
                    }
                    for (const [to, dirs] of Object.entries(stop_segs[from] || {})) {
                        if (Object.hasOwn(dirs, dir) && canReachSecondStop.has(to)) {
                            segments.push([from, to]);
                        }
                    }
                }
                paths[dir] = segments;
            }

            console.log(Object.fromEntries(Object.entries(paths).map(([dir, segs]) => [
                directions[dir % directions.length],
                segs.map(seg => seg.map(stopId => `${stopId} ${stops[stopId][0]}`))
            ])));
            renderDAG();
        }

        function renderDAG() {
            const svg = d3.select("#dag");
            svg.selectAll("*").remove();

            svg.append("style").text(`
                #dag {
                    display: block;
                    width: 100%;
                    height: 100%;
                    background: white;
                }

                #dag .node rect {
                    stroke: black;
                    fill: white;
                    stroke-width: 1px;
                }

                #dag .node text {
                    fill: black;
                    font: 12px sans-serif;
                }

                #dag .direction-label {
                    fill: black;
                    font: bold 16px sans-serif;
                }

                #dag .edgePath path {
                    stroke: black;
                    stroke-width: 2px;
                    fill: none;
                }

                #dag .edgePath marker {
                    fill: black;
                }

                #dag .edgeLabel {
                    fill: black;
                    font-size: 10px;
                }
            `);

            const viewport = svg.append("g");

            let xOffset = 20;

            function setNode(graph, stopId) {
                if (!graph.hasNode(stopId)) {
                    graph.setNode(stopId, {
                        label: `${stopId} ${stops[stopId][0]}`,
                        rx: 5,
                        ry: 5,
                        padding: 5
                    });
                }
            }

            for (const [dir, segs] of Object.entries(paths)) {
                const graph = new dagreD3.graphlib.Graph()
                    .setGraph({
                        rankdir: "TB",
                        nodesep: 20,
                        ranksep: 40,
                        marginx: 0,
                        marginy: 0
                    })
                    .setDefaultEdgeLabel(() => ({}));

                for (const [from, to] of segs) {
                    setNode(graph, from);
                    setNode(graph, to);
                    graph.setEdge(from, to, {
                        curve: d3.curveBasis,
                        arrowhead: "vee"
                    });
                }

                const group = viewport.append("g").attr("class", "direction").attr("transform", `translate(${xOffset}, 0)`);
                const inner = group.append("g").attr("transform", "translate(0, 10)");

                new dagreD3.render()(inner, graph);

                let bbox = group.node().getBBox();
                group.append("text")
                    .attr("class", "direction-label")
                    .attr("x", bbox.x + bbox.width / 2)
                    .attr("text-anchor", "middle")
                    .text(`${directions[dir % directions.length]} (${services[Math.floor(dir / directions.length)]})`);

                bbox = group.node().getBBox(); // Update bbox after adding the label
                group.attr("transform", `translate(${xOffset - bbox.x}, 0)`);
                xOffset += + bbox.width + 20;
            }

            const elHeight = document.getElementById("dag").clientHeight;
            svg
                .attr("width", xOffset)
                .attr("height", elHeight)
                .attr("viewBox", `0 0 ${xOffset} ${elHeight}`);

            const zoom = d3.zoom()
                .filter(() => {
                    const ev = d3.event;
                    if (ev.target.closest("text")) {
                        return false; // Disable zooming when clicking on text elements
                    }
                    return true;
                })
                .on("zoom", () => {
                    viewport.attr("transform", d3.event.transform);
                });
            svg.call(zoom);

            document.getElementById("export-svg").style.visibility = "visible";
        }

        function exportSVG() {
            const svgEl = document.getElementById("dag").cloneNode(true);
            svgEl.getElementsByTagName("g")[0].removeAttribute("transform");
            svgEl.removeAttribute("style");

            const bgRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            bgRect.setAttribute("x", 0);
            bgRect.setAttribute("y", 0);
            bgRect.setAttribute("width", "100%");
            bgRect.setAttribute("height", "100%");
            bgRect.setAttribute("fill", "#fff");
            svgEl.insertBefore(bgRect, svgEl.firstChild);

            svgEl.querySelectorAll("[marker-start], [marker-mid], [marker-end]").forEach(el => {
                for (const attr of ["marker-start", "marker-mid", "marker-end"]) {
                    const value = el.getAttribute(attr);
                    if (value) {
                        el.setAttribute(attr, value.replace(/url\([^#]*#/, "url(#")); // Remove URL prefix for SVG export
                    }
                }
            });

            document.body.appendChild(svgEl);
            const bbox = svgEl.getBBox();
            document.body.removeChild(svgEl);

            svgEl.setAttribute("viewBox", `${bbox.x - 10} ${bbox.y - 10} ${bbox.width + 20} ${bbox.height + 20}`);
            svgEl.setAttribute("width", bbox.width + 20);
            svgEl.setAttribute("height", bbox.height + 20);

            let source = new XMLSerializer().serializeToString(svgEl);
            source = '<?xml version="1.0" encoding="UTF-8"?>\n' + source.replace(
                "<svg", '<svg xmlns="http://www.w3.org/2000/svg"'
            );

            const blob = new Blob([source], { type: "image/svg+xml" });
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = `wt_perf_analysis_${firstStopId}_${secondStopId}.svg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
        document.getElementById("export-svg").addEventListener("click", exportSVG);
    </script>
</body>
</html>
